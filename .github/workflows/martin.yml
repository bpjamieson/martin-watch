name: Martin restock watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test push to my phone"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Load last state
        uses: actions/cache/restore@v4
        with:
          path: martin_state.json
          key: martin-state-${{ github.run_id }}
          restore-keys: martin-state-

      - name: Check stock
        run: python martin_watch.py ${{ inputs.test && '--test' || '' }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: martin_state.json
          key: martin-state-${{ github.run_id }}
